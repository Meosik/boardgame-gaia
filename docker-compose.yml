services:

  # ── Infrastructure ────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gaiaproject
      POSTGRES_USER: gaia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gaia -d gaiaproject"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Application Services ─────────────────────────────────────────────────
  gaia-server:
    build:
      context: .
      dockerfile: gaia-server/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://gaia:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/gaiaproject
      PORT: "8080"
      RUST_LOG: info
      # Shared passphrase gating every route behind the tunnel — set it in .env
      # and hand it out to invited players; leave unset to disable the gate.
      GAIA_SITE_PASSWORD: ${GAIA_SITE_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── External access ──────────────────────────────────────────────────────
  # Cloudflare Tunnel: reaches gaia-server over the internal docker network,
  # so no host port needs to stay open to the internet.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env}
    depends_on:
      gaia-server:
        condition: service_healthy

volumes:
  postgres_data:
