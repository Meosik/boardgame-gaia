# Container logs are the only record of who reached the server, and json-file keeps them
# forever by default — one busy day of gate lines would grow until the disk filled. 10 MB x 3
# bounds that while still leaving recent history to look through.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  # ── Infrastructure ────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: gaiaproject
      POSTGRES_USER: gaia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gaia -d gaiaproject"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Application Services ─────────────────────────────────────────────────
  gaia-server:
    build:
      context: .
      dockerfile: gaia-server/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://gaia:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/gaiaproject
      PORT: "8080"
      RUST_LOG: info
      # Shared passphrase gating every route behind the tunnel — set it in .env
      # and hand it out to invited players; leave unset to disable the gate.
      GAIA_SITE_PASSWORD: ${GAIA_SITE_PASSWORD:-}
      # AI seats ("AI 3명과 대전"). Clear GAIA_AI_DIR in .env to turn them off.
      GAIA_AI_DIR: ${GAIA_AI_DIR-/opt/gaia/gaia-rl}
      GAIA_AI_WORKERS: ${GAIA_AI_WORKERS:-6}
      GAIA_AI_LEVEL: ${GAIA_AI_LEVEL:-normal}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── External access ──────────────────────────────────────────────────────
  # Cloudflare Tunnel: reaches gaia-server over the internal docker network,
  # so no host port needs to stay open to the internet.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    logging: *default-logging
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env}
    depends_on:
      gaia-server:
        condition: service_healthy

volumes:
  postgres_data:
