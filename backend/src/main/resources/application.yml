spring:
  application:
    name: gaia-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gaia}
    username: ${SPRING_DATASOURCE_USERNAME:gaia}
    password: ${SPRING_DATASOURCE_PASSWORD:gaia1234}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

jwt:
  secret: ${JWT_SECRET:change-this-secret-key-change-this-secret-key}

server:
  port: 8080
