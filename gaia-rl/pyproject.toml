[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[project]
name = "gaia-rl"
version = "0.1.0"
description = "Offline Gaia Project self-play environment and PPO training tools."
requires-python = ">=3.12"
dependencies = ["pettingzoo==1.27.0", "gymnasium==1.2.2", "numpy==2.5.3"]

[project.optional-dependencies]
train = ["ray[rllib]==2.58.0", "torch==2.14.0"]

[tool.maturin]
python-source = "python"
module-name = "gaia_rl._native"
features = ["python"]
