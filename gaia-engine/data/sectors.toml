# Sector templates
#
# STANDARD sectors (01-10): radius-2 axial grid, 19 hexes each.
# DEEP SPACE sectors (11-18): 3-hex tiles (Lost Fleet expansion), always included.
#
# planet values: "Terra","Swamp","Desert","Oxide","Titanium","Volcanic","Ice",
#                "Transdim","Gaia","LostPlanet","Asteroid","ProtoPlanet"
# Hexes without planets omit the planet field.
# s05/s06/s07 are double-sided; distinguished by side = "A"/"B".
# All deep space sectors (11-18) are double-sided.
# s09/s10 mark is_lost_fleet = true (expansion availability flag).
#
# Standard sector coordinate order: center (0,0), inner ring (6), outer ring (12) = 19 total.
# Deep space sector coordinates: (0,0), (1,0), (0,1) — 3 hexes.

