# Lost Fleet expansion factions
#
# `home_planet` and `starting_structures` are transcribed from the rulebook
# (docs/GP_Exp_Rule_EN_V1_Web.pdf, p.13 "Appendix I: New Factions"): all 4
# factions have no home planet and start on an Asteroid or Protoplanet, with
# only 1 starting structure — Tinkeroids get their Planetary Institute,
# the other 3 get 1 mine (placed during setup's "second stage of placement",
# not modeled by the engine yet).
#
# `starting_ore`/`starting_credits`/`starting_knowledge`/`starting_qic`/
# `starting_bowl1-3` are NOT yet confirmed against a primary source (the
# rulebook only prints faction abilities in prose, not the numeric resource
# bowls shown on the physical faction boards) — treat these as placeholders
# pending a confirmed board scan, per the project's stance on unverified data
# (see PRD "Data and rulebook reconciliation gate").
[[factions]]
id = "Tinkeroids"
home_planet = "Asteroid"
starting_ore = 4
starting_credits = 15
starting_knowledge = 2
starting_qic = 1
starting_bowl1 = 4
starting_bowl2 = 2
starting_bowl3 = 0
gaiaformers = 3
[[factions.starting_structures]]
rel_q = 0
rel_r = 0
kind = "PlanetaryInstitute"
# Faction board icon (docs/GP_Exp_Rule_EN_V1_Web.pdf doesn't print this in
# prose; confirmed against gaia-frontend/src/assets/faction_boards/faction_board_09b.jpg).
[[factions.starting_track_bonuses]]
track = "Science"
level = 1

